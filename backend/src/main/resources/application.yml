spring:
  application:
    name: squadpulse-backend
  # Local dev convenience: load the repo-root .env (git-ignored) so the backend sees the same
  # values docker-compose uses, whether it's started from backend/ or from the repo root.
  # Optional, so CI / production (real env vars) are unaffected.
  config:
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:./.env[.properties]"
  # Boot 4 property; the old spring.data.mongodb.uri is deprecated at error level.
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      # Off by default in Spring Data MongoDB, which means @Indexed annotations are silently
      # ignored. Needed for the globally unique User.email index (KAN-17) — without it, duplicate
      # emails across clubs would be accepted and login-by-email would become ambiguous.
      auto-index-creation: true
    # Refresh-token families (auth.RefreshTokenService). Same env vars docker-compose uses. Host and
    # port default to the local docker-compose Redis; the connection is only opened on first use, so
    # a missing Redis surfaces on the first login/refresh, not at startup.
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: 8080

# App-specific config — real values come from environment variables / a secrets manager,
# never hardcoded here (see docs/spec.md section 10, CLAUDE.md standing rule 5).
# Deliberately no defaults: SecurityProperties validates these at startup, so a missing
# secret fails fast instead of silently running with an empty JWT secret or pepper.
squadpulse:
  security:
    jwt-secret: ${JWT_SECRET:}
    password-pepper: ${PASSWORD_PEPPER:}
    # Not secrets, so set here rather than via env vars (see auth.TokenProperties).
    token:
      access-ttl: 15m
      refresh-ttl: 30d

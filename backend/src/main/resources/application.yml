spring:
  application:
    name: squadpulse-backend
  # Local dev convenience: load the repo-root .env (git-ignored) so the backend sees the same
  # values docker-compose uses, whether it's started from backend/ or from the repo root.
  # Optional, so CI / production (real env vars) are unaffected.
  config:
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:./.env[.properties]"
  # Boot 4 property; the old spring.data.mongodb.uri is deprecated at error level.
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      # Off by default in Spring Data MongoDB, which means @Indexed / @CompoundIndex annotations are
      # silently ignored. Needed for the globally unique User.email index (KAN-17) — without it,
      # duplicate emails across clubs would be accepted and login-by-email would become ambiguous —
      # and for the partial unique jersey-number index on Player (KAN-25).
      auto-index-creation: true
    # Refresh-token families, login throttling and activation / reset codes (auth.*Service). Same
    # env vars docker-compose uses. Host and port default to the local docker-compose Redis; the
    # connection is only opened on first use, so a missing Redis surfaces on the first
    # login/refresh, not at startup.
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  # JSON API only — no static files to serve. Without this, the default /** resource handler claims
  # every unmatched path and fails with NoResourceFoundException, so it never reaches the
  # NoHandlerFoundException → 404 handler in common.GlobalExceptionHandler (KAN-23).
  # (spring.mvc.throw-exception-if-no-handler-found is not needed: deprecated since Boot 3.2, and
  # Spring 7's DispatcherServlet always throws.)
  web:
    resources:
      add-mappings: false
  # The servlet container's limits on multipart uploads (player photos, KAN-29) — the outer guard:
  # an oversize file is refused while the body is parsed, before any handler runs (413 via
  # common.GlobalExceptionHandler). Boot's default max-file-size is 1MB, which would refuse valid
  # photos, so it's raised to the image limit below (squadpulse.images.max-size); the request limit
  # leaves room for the multipart framing around the file. DataSize "MB" is 1024 * 1024 bytes.
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

server:
  port: 8080
  tomcat:
    # When a request is answered before its body has been read — an oversize upload refused with a
    # 413 (spring.servlet.multipart above), or a 401 before the body is looked at — Tomcat reads and
    # discards at most this much of the rest, and resets the connection beyond it. The default 2MB is
    # below the upload limit itself, so a 3 MB photo got a reset instead of its 413, depending on
    # timing (KAN-29). 20MB covers any photo a user might pick by mistake (phone cameras produce up
    # to ~15 MB) while still bounding how much a client can make the server read for nothing.
    max-swallow-size: 20MB

# App-specific config — real values come from environment variables / a secrets manager,
# never hardcoded here (see docs/spec.md section 10, CLAUDE.md standing rule 5).
# Deliberately no defaults: SecurityProperties validates these at startup, so a missing
# secret fails fast instead of silently running with an empty JWT secret or pepper.
squadpulse:
  security:
    jwt-secret: ${JWT_SECRET:}
    password-pepper: ${PASSWORD_PEPPER:}
    # Not secrets, so set here rather than via env vars (see auth.TokenProperties).
    token:
      access-ttl: 15m
      refresh-ttl: 30d
    # Failed-login limit per (email, IP) pair (see auth.LoginThrottleProperties).
    login-throttle:
      max-attempts: 5
      window: 15m
    # Activation / reset codes, and forgot-password requests per email — the long request window is
    # what bounds brute-forcing a code (see auth.PasswordResetProperties, auth.PasswordResetCodeService).
    password-reset:
      code-ttl: 15m
      max-attempts: 5
      max-requests: 5
      request-window: 24h
  # Uploaded images (see common.ImageProperties, common.ImageValidator): the largest accepted, the
  # limit the API promises. spring.servlet.multipart.max-file-size above must not be lower.
  images:
    max-size: 2MB

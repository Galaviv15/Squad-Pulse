# Local development profile (KAN-56): ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# The Vite dev server serves the SPA over HTTPS and proxies the API here over plain http, adding
# X-Forwarded-For / -Host / -Port / -Proto (xfwd in frontend/vite.config.ts). Honoring them makes
# the request look like the browser's https://localhost:5173 one, so URLs the backend builds from
# the request (the Location of POST /squad/players) point at the dev server.
#
# Only in this profile, never by default: trusting forwarded headers lets whoever sends them choose
# the scheme, host and client address the app sees. "native" = Tomcat's RemoteIpValve, which trusts
# them only from server.tomcat.remoteip.internal-proxies (Boot's default: loopback and private
# ranges), so a request from anywhere else keeps its real peer address — unlike "framework"
# (Spring's ForwardedHeaderFilter), which trusts every sender. The login throttle keys on
# getRemoteAddr(): through the proxy that is still the loopback address (the X-Forwarded-For Vite
# adds), but a loopback client could pick its own by sending X-Forwarded-For — acceptable for local
# development only.
#
# Those requests then count as secure, so Spring Security would add its HSTS header
# (Strict-Transport-Security: max-age=31536000 ; includeSubDomains); browsers keep that for
# localhost — every port, not just 5173 — for a year and force https on other local projects. It's
# switched off here only; the default stays on, unchanged.
server:
  forward-headers-strategy: native

squadpulse:
  security:
    hsts-enabled: false

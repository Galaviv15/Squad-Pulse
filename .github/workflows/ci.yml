name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# A new push to the same PR / branch cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The runner image is pinned on purpose (not ubuntu-latest), so the OS only changes in
  # a PR that changes it. Moving to ubuntu-26.04 (Docker 29, which Testcontainers uses)
  # is a deliberate future change.
  backend-ci:
    name: backend-ci
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Formatting gate: fails if someone forgot to run `./mvnw spotless:apply`.
      - name: Check formatting
        run: ./mvnw --batch-mode --no-transfer-progress spotless:check

      # Compiles and runs all tests.
      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # End-to-end tests (KAN-53): the built SPA, served over HTTPS by `vite preview`, against the
  # real backend (packaged jar) + MongoDB + Redis from docker-compose, in Chromium and WebKit. See
  # README "End-to-end tests". Not a required check.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Throwaway credentials for this run's containers only, written straight to the git-ignored
      # .env (docker-compose and the E2E backend read it) and never printed. Hex, so they're safe
      # inside the MongoDB URI.
      - name: Create a throwaway .env
        run: |
          {
            echo "MONGO_ROOT_USERNAME=squadpulse"
            echo "MONGO_ROOT_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SECRET=$(openssl rand -hex 48)"
            echo "PASSWORD_PEPPER=$(openssl rand -hex 48)"
          } > .env

      # --wait returns once both healthchecks pass (the MongoDB one also initiates the replica set).
      - name: Start MongoDB and Redis
        run: docker compose up -d --wait --wait-timeout 180

      # Playwright runs with ignoreHTTPSErrors, so a self-signed certificate is enough. Same file
      # names as frontend/devHttps.ts; frontend/.cert/ is git-ignored.
      - name: Create a self-signed certificate
        working-directory: frontend
        run: |
          mkdir -p .cert
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout .cert/localhost-key.pem -out .cert/localhost.pem

      # `npm run e2e` builds it too; done first here so a compile failure shows as its own step.
      - name: Build the backend jar
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Read the Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The browsers are cached per Playwright version; their system packages aren't, so they're
      # installed on every run.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium webkit

      - name: Run the E2E tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload the E2E report, traces and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/e2e/.logs/
          retention-days: 7
          if-no-files-found: ignore
